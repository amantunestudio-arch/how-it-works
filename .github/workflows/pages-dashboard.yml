name: Deploy dashboard only

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Keep only dashboard
        run: |
          mkdir _dash
          cp docs/dashboard.html _dash/dashboard.html
          cp -r docs/assets _dash/assets
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _dash
      - id: deployment
        uses: actions/deploy-pages@v4

